[project]
name = "ds301-course-companion"
version = "0.1.0"
description = "Lecture-aligned coding notebooks for DS301: Data Science"
authors = [{ name = "Bhawani Shankar Leelar" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "jupyterlab>=4.2,<5.0",
  "matplotlib>=3.9,<4.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "scikit-learn>=1.5,<2.0",
  "seaborn>=0.13,<1.0",
  "statsmodels>=0.14,<1.0",
  "scipy>=1.14,<2.0",
]

[tool.poetry]
package-mode = false
