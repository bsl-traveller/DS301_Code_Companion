[project]
name = "ds301-course-companion"
version = "0.1.0"
description = "Lecture-aligned notebooks and reusable utilities for DS301: Data Science"
authors = [{ name = "Bhawani Shankar Leelar" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jupyterlab>=4.2,<5.0",
  "matplotlib>=3.9,<4.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "scikit-learn>=1.5,<2.0",
  "seaborn>=0.13,<1.0",
  "statsmodels>=0.14,<1.0",
  "scipy>=1.14,<2.0",
  "requests>=2.31,<3.0",
  "ucimlrepo>=0.0.7,<1.0",
  "openpyxl>=3.1,<4.0",
  "jupytext>=1.16,<2.0",
  "pydantic>=2.10,<3.0",
]

[tool.poetry]
packages = [{ include = "ds301", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.6,<1"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
